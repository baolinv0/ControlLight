[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-guided-pseudo-gt-selector"
version = "0.1.0"
description = "Person-centric tone selector for source-aligned pseudo ground truth"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pseudo-gt-selector = "pseudo_gt_selector.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pseudo_gt_selector*"]
